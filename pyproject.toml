[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathotme"
version = "0.1.0"
description = "OpenTME-conditioned whole-slide pathology experiments"
requires-python = ">=3.10,<3.12"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "PyYAML",
  "scikit-learn",
]

[project.optional-dependencies]
guided-vila = ["torch"]

[tool.setuptools.packages.find]
include = ["pathotme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
